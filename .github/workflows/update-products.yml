name: Update Products

on:
  schedule:
    - cron: "2-59/15 * * * *"
  workflow_dispatch:

concurrency:
  group: update-products
  cancel-in-progress: true

jobs:
  update-products:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install browser dependencies
        run: python -m playwright install --with-deps chromium || python -m patchright install --with-deps chromium

      - name: Ensure database schema
        run: python -m database.init_schema

      - name: Run product update job
        run: python jobs/update_products.py